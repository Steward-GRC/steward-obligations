syntax = "proto3";

package steward.obligations.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "steward/obligations/v1/notification_preferences.proto";

option go_package = "github.com/Steward-GRC/steward-obligations/gen/go/steward/obligations/v1;obligationsv1";

// InboxService is the signed-in user's in-app notification inbox: the notices
// the platform wrote for them on the in-app channel. Every method acts for the
// forwarded actor and never takes a user id, so a caller can only ever see and
// change its own notices.
service InboxService {
  // ListNotices returns the actor's notices, newest first, one page at a time.
  rpc ListNotices(ListNoticesRequest) returns (ListNoticesResponse);
  // CountUnread returns how many of the actor's notices are unread.
  rpc CountUnread(CountUnreadRequest) returns (CountUnreadResponse);
  // MarkRead marks one of the actor's notices read. It is idempotent: a notice
  // already read keeps its first read time. A notice that does not exist, or
  // belongs to someone else, is not found.
  rpc MarkRead(MarkReadRequest) returns (MarkReadResponse);
  // MarkAllRead marks every unread notice of the actor read.
  rpc MarkAllRead(MarkAllReadRequest) returns (MarkAllReadResponse);
}

// InboxFilter narrows a listing to the bell's tabs.
enum InboxFilter {
  INBOX_FILTER_UNSPECIFIED = 0; // same as ALL
  INBOX_FILTER_ALL = 1;
  // NEEDS_ACTION is the notices that wait on the person (an acknowledgement, an
  // approval or an assignment).
  INBOX_FILTER_NEEDS_ACTION = 2;
  // UPDATES is every notice that does not need action.
  INBOX_FILTER_UPDATES = 3;
}

// Notice is one in-app notification. The service gives the facts; the gateway
// renders the title, the line and the link from kind and payload.
message Notice {
  string id = 1;
  // kind is the notification-type taxonomy key (for example
  // "policy-ack-reminder").
  string kind = 2;
  // category is the kind's taxonomy category; an unknown kind is INFORMATIONAL.
  NotifCategory category = 3;
  // needs_action is true when the notice waits on the person.
  bool needs_action = 4;
  // payload is the structured data the notice was written with (ids to link
  // to, a reminder type). It is as written, with the same keys.
  google.protobuf.Struct payload = 5;
  google.protobuf.Timestamp created_at = 6;
  // read_at is unset while the notice is unread.
  google.protobuf.Timestamp read_at = 7;
}

message ListNoticesRequest {
  InboxFilter filter = 1;
  // page_size is the most notices to return; 0 means 20 and the limit is 100.
  int32 page_size = 2;
  // page_token is next_page_token from the previous page; empty starts at the
  // newest notice.
  string page_token = 3;
}

message ListNoticesResponse {
  repeated Notice notices = 1;
  // next_page_token is empty on the last page.
  string next_page_token = 2;
}

message CountUnreadRequest {}

message CountUnreadResponse {
  int64 unread = 1;
}

message MarkReadRequest {
  string id = 1;
}

message MarkReadResponse {
  Notice notice = 1;
  // unread is the actor's unread count after the change.
  int64 unread = 2;
}

message MarkAllReadRequest {}

message MarkAllReadResponse {
  // marked is how many notices this call marked read.
  int64 marked = 1;
}
